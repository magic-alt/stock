services:
  api:
    build:
      context: .
      target: production
    ports:
      - "${PLATFORM_HOST_PORT:-8000}:8000"
    volumes:
      - ./cache:/app/cache
      - ./report:/app/report
      - ./data_lake:/app/data_lake
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - PORT=8000
      - PLATFORM_API_TOKEN=${PLATFORM_API_TOKEN:-}
      - PLATFORM_API_AUTH_DISABLED=${PLATFORM_API_AUTH_DISABLED:-0}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v2/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
