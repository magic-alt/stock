name: Gate 1 Settings Integration

on:
  push:
    branches:
      - config/gate1-typed-settings-ssot

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: config/gate1-typed-settings-ssot
          fetch-depth: 0

      - name: Apply integration patch
        run: python scripts/_gate1_apply.py

      - name: Syntax check
        run: >-
          python -m py_compile
          src/core/config.py
          src/core/settings.py
          src/platform/api_v2.py
          src/platform/api_auth.py
          src/cli/main.py
          src/cli/config_commands.py
          scripts/run_platform_api.py

      - name: Commit integration and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gate1-settings-apply.yml scripts/_gate1_apply.py
          git add src/core/config.py src/platform/api_v2.py src/platform/api_auth.py src/cli/main.py
          git commit -m "refactor(config): route runtime consumers through PlatformSettings"
          git pull --rebase origin config/gate1-typed-settings-ssot
          git push origin HEAD:config/gate1-typed-settings-ssot
