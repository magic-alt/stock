name: Frontend Lockfile Refresh

on:
  push:
    branches:
      - ci/gate0-governance-hardening

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ci/gate0-governance-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh package-lock.json
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit package-lock.json
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(frontend): synchronize npm lockfile"
          git push origin HEAD:ci/gate0-governance-hardening
