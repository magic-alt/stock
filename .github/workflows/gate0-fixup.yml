name: Gate 0 Compatibility Fixup

on:
  push:
    branches:
      - ci/gate0-governance-hardening

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v6
        with:
          ref: ci/gate0-governance-hardening
          fetch-depth: 0

      - name: Apply compatibility and lint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "frontend/src/api/client.ts",
              "import axios from 'axios'\nimport type { AxiosInstance, AxiosResponse } from 'axios'",
              "import axios, { type AxiosInstance, type AxiosResponse } from 'axios'",
          )
          replace(
              "frontend/src/views/Dashboard.vue",
              "import { resolveStockInput, searchStocks } from '@/utils/stockSearch'\nimport type { StockSearchResult } from '@/utils/stockSearch'",
              "import { resolveStockInput, searchStocks, type StockSearchResult } from '@/utils/stockSearch'",
          )
          replace(
              "tests/test_distribution_split.py",
              "from pathlib import Path\nimport tomllib",
              "from pathlib import Path\n\ntry:\n    import tomllib\nexcept ModuleNotFoundError:  # Python 3.10\n    import tomli as tomllib",
          )
          replace(
              "tests/test_plugin_spi_sdk.py",
              "    pytest.importorskip(\"tomllib\")\n    import tomllib\n\n    pyproject = tomllib.loads(Path(\"pyproject.toml\").read_text(encoding=\"utf-8\"))",
              "    try:\n        import tomllib\n    except ModuleNotFoundError:  # Python 3.10\n        import tomli as tomllib\n\n    pyproject = tomllib.loads(Path(\"pyproject.toml\").read_text(encoding=\"utf-8\"))",
          )
          replace(
              "pyproject.toml",
              '    "mypy>=1.5.0",\n]',
              '    "mypy>=1.5.0",\n    "tomli>=2.0.0; python_version < \'3.11\'",\n]',
          )

          path = Path("tests/test_v5_engineering.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("    def test_test_job_exists(self, ci_config):")
          end_marker = "        assert len(os_list) >= 2  # At least ubuntu + windows"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''    def test_supported_python_jobs_exist(self, ci_config):
              jobs = ci_config.get("jobs", {})
              assert "python-tests" in jobs
              assert "windows-tests" in jobs

          def test_python_matrix_matches_supported_versions(self, ci_config):
              test_job = ci_config["jobs"]["python-tests"]
              matrix = test_job.get("strategy", {}).get("matrix", {})
              versions = [str(v) for v in matrix.get("python-version", [])]
              assert versions == ["3.10", "3.11", "3.12"]

          def test_security_gate_job(self, ci_config):
              jobs = ci_config.get("jobs", {})
              assert "security-gate" in jobs
              assert "security-gate" in jobs["required-checks"]["needs"]

          def test_code_quality_job(self, ci_config):
              jobs = ci_config.get("jobs", {})
              assert "code-quality" in jobs

          def test_uses_checkout_action(self, ci_config):
              test_job = ci_config["jobs"]["python-tests"]
              steps = test_job.get("steps", [])
              has_checkout = any("checkout" in str(s.get("uses", "")) for s in steps)
              assert has_checkout

          def test_linux_and_windows_are_both_required(self, ci_config):
              jobs = ci_config.get("jobs", {})
              assert jobs["python-tests"]["runs-on"] == "ubuntu-latest"
              assert jobs["windows-tests"]["runs-on"] == "windows-latest"
              required = jobs["required-checks"]["needs"]
              assert "python-tests" in required
              assert "windows-tests" in required'''
          replacement = "\n".join(line[4:] if line.startswith("    ") else line for line in replacement.splitlines())
          replacement = "\n".join("    " + line if line else line for line in replacement.splitlines())
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Refresh frontend lockfile and apply safe audit fixes
        working-directory: frontend
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --audit-level=high || true

      - name: Commit fixups
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json frontend/src/api/client.ts frontend/src/views/Dashboard.vue pyproject.toml tests/test_distribution_split.py tests/test_plugin_spi_sdk.py tests/test_v5_engineering.py
          if git diff --cached --quiet; then
            echo "No fixups required"
            exit 0
          fi
          git commit -m "fix(ci): resolve compatibility findings from expanded gates"
          git pull --rebase origin ci/gate0-governance-hardening
          git push origin HEAD:ci/gate0-governance-hardening
