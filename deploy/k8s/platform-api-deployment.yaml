apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-api
          image: quant-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PLATFORM_API_HOST
              value: "0.0.0.0"
            - name: PLATFORM_API_PORT
              value: "8000"
            - name: PLATFORM_API_AUTH_DISABLED
              value: "0"
            - name: PLATFORM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-api-secrets
                  key: api-token
            - name: PLATFORM_JOB_STORE
              value: /data/platform/jobs.sqlite
            - name: PLATFORM_JOB_STORE_FALLBACK
              value: "0"
            - name: PLATFORM_JOB_MAX_WORKERS
              value: "2"
            - name: MARKET_DATA_DUCKDB_PATH
              value: /data/market_data.duckdb
            - name: PLATFORM_AUDIT_LOG
              value: /data/logs/audit.log
            - name: QLIB_DATA
              value: /data/qlib_data
          livenessProbe:
            httpGet:
              path: /api/v2/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v2/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: platform-api-data
